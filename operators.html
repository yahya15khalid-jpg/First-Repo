<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Assignment Operator
        let x=  35;
        let y = 30;
        console.log( x += y)
        console.log( x -= y)
        console.log( x *= y)
        console.log( x /= y)
        console.log( x %= y)

        // Relational Operators
        let a = 55;
        let b = "65";
        console.log(a == b)
        console.log(a != b)
        console.log(a === b)
        console.log(a !== b)
        console.log(a > b)
        console.log(a >= b)
        console.log(a < b)
        console.log(a <= b)

    </script>
</body>
</html>
